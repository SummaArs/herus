####
# Every number in docs/, re-derived; every invariant, re-checked — on two
# compilers and two operating systems, so that a host-specific assumption fails
# here instead of on the bench.
####
name: prove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  prove:
    name: prove (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain in use
        run: |
          cc --version
          make --version | head -1
          python3 --version

      - name: Prove
        run: ./prove.sh | tee /tmp/prove.txt

      - name: Sanitizers
        run: make -C sim sanitizers

      - name: Firmware sanitizers
        run: make -C firmware sanitizers

      - name: Firmware static analyzer
        run: make -C firmware analyzer

      - name: Research prototype
        run: make -C research test

      - name: Publish the invariant ledger
        if: always()
        run: |
          {
            echo '## Invariants — ${{ matrix.os }}'
            echo '```'
            sed -n '/INVARIANT CHECKS/,$p' /tmp/prove.txt || echo 'the run did not reach the ledger'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prove-${{ matrix.os }}
          path: /tmp/prove.txt
          if-no-files-found: warn

  codeql:
    name: CodeQL (C/C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build firmware and simulator
        run: |
          make -C firmware all
          make -C sim build/herus-sim
      - uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          category: /language:c-cpp
