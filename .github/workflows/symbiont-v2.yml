name: symbiont-v2

on:
  push:
    branches:
      - 'feature/herus-symbiont-v2-*'
  pull_request:
    paths:
      - 'research/symbiont_v2/**'
      - '.github/workflows/symbiont-v2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s research/symbiont_v2 -p 'test_*.py'
      - name: Compile check
        run: python -m compileall -q research/symbiont_v2
