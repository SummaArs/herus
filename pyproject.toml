[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herus-symbiotic-learning"
version = "0.1.0"
description = "Proposal-only, bounded and auditable Symbiotic Learning research library"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools]
packages = ["herus_symbiotic", "research"]
